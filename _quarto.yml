project:
  type: website
  output-dir: _site
  # Only the landing pages are published. Writing lives on Substack;
  # posts/ is kept as an archive and deliberately not rendered.
  render:
    - index.qmd
    - writing.qmd
    - about.qmd
    - contact.qmd

website:
  title: "Torri Callan"
  description: "Data scientist with a PhD in statistics and a background in elite sport, writing about sports performance and training science."
  site-url: https://torricallan.com.au
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: writing.qmd
        text: Generative Periodisation
      - href: about.qmd
        text: About
      - href: contact.qmd
        text: Contact
  page-footer:
    center: "© 2026 Torri Callan"

format:
  html:
    theme:
      light: custom.scss
    css: styles.css
    toc: false
    page-layout: article
    grid:
      body-width: 700px
